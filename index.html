  if (CONFIG.profilePhotoUrl && CONFIG.profilePhotoUrl.trim() !== "") {
    const img = document.getElementById('avatar-img');
    const placeholder = document.querySelector('.avatar-placeholder');
    img.src = CONFIG.profilePhotoUrl;
    img.alt = CONFIG.fullName;
    img.style.display = 'block';
    placeholder.style.display = 'none';
  }

  // ---- "Save to my contacts" -> generates and downloads a .vcf ----
  document.getElementById('save-row').addEventListener('click', function () {
    const v = CONFIG.vcard;
    const lines = [
      "BEGIN:VCARD",
      "VERSION:3.0",
      "N:" + v.lastName + ";" + v.firstName + ";;;",
      "FN:" + v.firstName + " " + v.lastName,
      "ORG:" + v.org,
      "TITLE:" + v.title,
      "TEL;TYPE=CELL:" + v.phone,
      "EMAIL:" + v.email,
      "END:VCARD"
    ];
    const blob = new Blob([lines.join("\n")], { type: "text/vcard" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = (v.firstName + "_" + v.lastName).replace(/\s+/g, "_") + ".vcf";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  });
</script>

<style>
  :root{
    --navy:#070812;
    --blue:#3356F6;
    --blue-wash:#3356F60d;
    --ink:#15161d;
    --gray:#6b6e78;
    --gray-light:#9a9ca4;
    --hairline:#e7e8ec;
    --paper:#ffffff;
    --surface:#fafafb;
    --radius:16px;
  }

  *{ box-sizing:border-box; }

  html,body{
    margin:0;
    padding:0;
    min-height:100%;
    background:var(--paper);
    color:var(--ink);
    font-family:'Arimo', 'Inter', system-ui, sans-serif;
    -webkit-font-smoothing:antialiased;
  }

  .stage{
    position:relative;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    max-width:460px;
    margin:0 auto;
    background:var(--paper);
    box-shadow:0 0 60px rgba(0,0,0,0.05);
  }

  /* ---------- dark header ---------- */
  .header{
    background:linear-gradient(135deg, #0a0b14 0%, var(--navy) 60%, #0c1230 100%);
    padding:46px 24px 72px;
    display:flex;
    align-items:center;
    justify-content:center;
  }

  .logo{
    height:64px;
    width:auto;
    display:block;
  }

  /* ---------- card body ---------- */
  .card{
    padding:0 26px 8px;
    display:flex;
    flex-direction:column;
  }

  .avatar-wrap{
    display:flex;
    justify-content:center;
    margin-top:-56px;
  }

  .avatar{
    width:128px;
    height:128px;
    border-radius:50%;
    background:var(--surface);
    border:5px solid var(--paper);
    box-shadow:0 4px 16px rgba(15,20,40,0.14);
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
  }

  .avatar-placeholder{
    width:56px;
    height:56px;
    color:var(--gray-light);
  }

  #avatar-img{
    width:100%;
    height:100%;
    object-fit:cover;
    border-radius:50%;
  }

  /* ---------- identity ---------- */
  .identity{
    text-align:center;
    margin-top:16px;
    margin-bottom:28px;
  }

  .org-line{
    margin:0 0 8px;
    font-size:11px;
    font-weight:700;
    letter-spacing:1.4px;
    text-transform:uppercase;
    color:var(--gray-light);
  }

  .name{
    margin:0;
    font-weight:700;
    font-size:22px;
    line-height:1.25;
    letter-spacing:0.1px;
    color:var(--ink);
  }

  .role{
    margin:6px 0 0;
    font-size:14px;
    font-weight:700;
    color:var(--blue);
    letter-spacing:0.3px;
  }

  /* ---------- contact list ---------- */
  .contact-list{
    display:flex;
    flex-direction:column;
    gap:10px;
  }

  .contact-row{
    display:flex;
    align-items:center;
    gap:14px;
    width:100%;
    padding:18px 20px;
    border-radius:var(--radius);
    background:var(--surface);
    border:1px solid var(--hairline);
    text-decoration:none;
    color:var(--ink);
    cursor:pointer;
    font:inherit;
    text-align:left;
    transition:background 0.18s ease, border-color 0.18s ease, transform 0.12s ease, box-shadow 0.18s ease;
  }

  .contact-row:hover{
    background:#ffffff;
    border-color:#d7d9e0;
    box-shadow:0 6px 16px rgba(15,20,40,0.07);
    transform:translateY(-1px);
  }

  .contact-row:active{ transform:translateY(0); }

  .row-text{
    display:flex;
    flex-direction:column;
    gap:3px;
    flex:1;
    min-width:0;
  }

  .row-label{
    font-size:10.5px;
    font-weight:700;
    letter-spacing:0.9px;
    text-transform:uppercase;
    color:var(--gray-light);
  }

  .row-value{
    font-size:14.5px;
    font-weight:600;
    color:var(--ink);
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }

  .row-go{
    flex:0 0 auto;
    color:var(--gray-light);
    font-size:15px;
  }

  .save-row{ background:var(--paper); border-style:dashed; border-color:#d7d9e0; }

  /* ---------- bottom actions ---------- */
  .actions{
    display:flex;
    gap:12px;
    padding:22px 26px calc(22px + env(safe-area-inset-bottom));
    border-top:1px solid var(--hairline);
    margin-top:88px;
  }

  .action-btn{
    flex:1;
    display:flex;
    flex-direction:column;
    gap:2px;
    padding:14px 18px;
    border-radius:13px;
    text-decoration:none;
    transition:transform 0.12s ease, filter 0.12s ease, box-shadow 0.12s ease;
  }

  .action-btn:hover{ transform:translateY(-1px); }
  .action-btn:active{ transform:translateY(0); }

  .btn-eyebrow{
    font-size:10px;
    font-weight:600;
    letter-spacing:0.8px;
    text-transform:uppercase;
    opacity:0.7;
  }

  .btn-title{
    font-size:14.5px;
    font-weight:700;
    letter-spacing:0.2px;
  }

  .action-btn.ghost{
    background:var(--paper);
    border:1.5px solid var(--ink);
    color:var(--ink);
  }

  .action-btn.solid{
    background:var(--blue);
    color:#ffffff;
    border:1.5px solid var(--blue);
    text-align:right;
    align-items:flex-end;
    box-shadow:0 6px 16px rgba(51,86,246,0.25);
  }

  @media (max-width:360px){
    .stage{ max-width:100%; }
    .name{ font-size:20px; }
  }
</style>

</body>
</html>
